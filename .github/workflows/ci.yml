# Phase 1 — Anatomy of a Workflow
# Smallest complete CI: check out, set up Node with npm caching, install, test.
name: CI
# Inputs aren't shown anywhere on a workflow_dispatch run, so put them in the
# run's title. For other events this evaluates to '' and GitHub falls back to
# the usual title (commit message or PR title).
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Manual · {0}{1}', inputs.environment, inputs.verbose && ' · verbose' || '') || '' }}"

on:
  push:
    branches: [main]
    # Phase 2, exercise 1: skip CI when a commit only touches Markdown.
    paths-ignore: ['**.md']
  pull_request:
    # For PRs the filter looks at the whole PR diff against the base branch,
    # not at each commit: one non-Markdown file anywhere in the PR runs CI.
    paths-ignore: ['**.md']
  # Phase 2, exercise 2: a manual "Run workflow" button with typed inputs.
  # It only appears in the Actions tab once this is on the default branch.
  workflow_dispatch:
    inputs:
      environment:
        description: Pretend target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
      verbose:
        description: Print extra detail
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Exercise 3: contexts. On a pull_request run ref_name is "<PR#>/merge";
      # head_ref holds the source branch (empty on push events).
      - run: echo "Branch is ${{ github.ref_name }}"
      - run: echo "test job started at $(date -u +%H:%M:%S)"
      - run: |
          echo "event:    ${{ github.event_name }}"
          echo "ref:      ${{ github.ref }}"
          echo "head_ref: ${{ github.head_ref }}"
          echo "base_ref: ${{ github.base_ref }}"
      # `inputs` is empty on push/pull_request runs. `inputs.verbose` is a real
      # boolean; the older `github.event.inputs.verbose` is the string "true"/"false".
      - run: |
          echo "environment:          '${{ inputs.environment }}'"
          echo "inputs.verbose:       '${{ inputs.verbose }}'"
          echo "event.inputs.verbose: '${{ github.event.inputs.verbose }}'"
          echo "verbose is boolean:   ${{ inputs.verbose == true }}"
          echo "verbose is string:    ${{ github.event.inputs.verbose == 'true' }}"
      - if: inputs.verbose
        run: echo "Verbose mode on — runner is ${{ runner.os }}/${{ runner.arch }}, run attempt ${{ github.run_attempt }}"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Exercise 4: a second job. No `needs:`, so it runs in parallel with `test`
  # on its own fresh runner — compare the two jobs' start times in the run.
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint job started at $(date -u +%H:%M:%S)"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
