# Phase 1 — Anatomy of a Workflow
# Smallest complete CI: check out, set up Node with npm caching, install, test.
name: CI

on:
  push:
    branches: [main]
    # Phase 2, exercise 1: skip CI when a commit only touches Markdown.
    paths-ignore: ['**.md']
  pull_request:
    # For PRs the filter looks at the whole PR diff against the base branch,
    # not at each commit: one non-Markdown file anywhere in the PR runs CI.
    paths-ignore: ['**.md']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Exercise 3: contexts. On a pull_request run ref_name is "<PR#>/merge";
      # head_ref holds the source branch (empty on push events).
      - run: echo "Branch is ${{ github.ref_name }}"
      - run: echo "test job started at $(date -u +%H:%M:%S)"
      - run: |
          echo "event:    ${{ github.event_name }}"
          echo "ref:      ${{ github.ref }}"
          echo "head_ref: ${{ github.head_ref }}"
          echo "base_ref: ${{ github.base_ref }}"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Exercise 4: a second job. No `needs:`, so it runs in parallel with `test`
  # on its own fresh runner — compare the two jobs' start times in the run.
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint job started at $(date -u +%H:%M:%S)"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run lint
